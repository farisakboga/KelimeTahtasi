:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--primary:#3157d5;--accent:#f4b942;--radius:18px;--word:clamp(74px,13vw,190px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Trebuchet MS",sans-serif;height:100vh;overflow:hidden;user-select:none}button,input{font:inherit}button{touch-action:manipulation}
.app{height:100vh;display:grid;grid-template-columns:270px 1fr;gap:10px;padding:10px}.panel,.stage{background:var(--panel);border-radius:var(--radius);box-shadow:0 8px 28px #24365d18}
.panel{padding:12px;overflow:auto}.brand{display:flex;align-items:center;gap:9px;margin-bottom:9px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3157d5,#6e8cff);display:grid;place-items:center;color:white;font-size:20px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}
.section{border-top:1px solid #e8ecf4;padding-top:9px;margin-top:9px}.section-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:7px;font-size:14px}.mini{border:0;background:#eef2ff;color:var(--primary);border-radius:8px;padding:5px 7px;font-size:11px;font-weight:700;cursor:pointer}
.chips{display:grid;grid-template-columns:repeat(5,38px);justify-content:space-between;gap:4px}.chip input{display:none}.chip span{display:grid;place-items:center;width:38px;height:34px;padding:0;border:2px solid #d8deea;border-radius:8px;font-family:TemelYazi,Arial,sans-serif;font-size:18px;line-height:1;font-weight:800;cursor:pointer;background:white}.chip input:checked+span{border-color:var(--primary);background:var(--primary);color:white;box-shadow:0 3px 8px #3157d544}#syllCounts{grid-template-columns:repeat(6,34px)}#syllCounts .chip span{width:34px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.mode button{border:2px solid #d8deea;background:white;border-radius:9px;padding:6px 3px;font-size:12px;font-weight:700;color:#536078}.mode button.active{border-color:var(--primary);color:var(--primary);background:#eef2ff}
.toggle{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px;font-weight:700}.switch{position:relative;width:48px;height:28px}.switch input{display:none}.slider{position:absolute;inset:0;background:#cad1df;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--primary)}.switch input:checked+.slider:before{transform:translateX(20px)}.auto-row{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center}.play-small{width:42px;height:42px;border:0;border-radius:12px;background:var(--accent);color:#312400;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 3px 9px #c68b1238}.speed-box{min-width:0}.speed-buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}.speed-buttons button{border:0;background:#eef2ff;color:var(--primary);border-radius:8px;padding:6px 3px;font-size:11px;font-weight:800;cursor:pointer}
.stage{display:grid;grid-template-rows:auto 1fr auto;min-width:0;overflow:hidden}.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e8ecf4}.count{font-weight:800}.sub{color:var(--muted);font-size:14px}.topbar .spacer{flex:1}.top-options{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.top-toggle{display:flex;align-items:center;gap:6px;min-height:36px;padding:5px 8px;border:1px solid #dfe4ed;background:#f8faff;border-radius:10px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.top-toggle .switch{width:36px;height:22px;flex:none}.top-toggle .slider:before{width:16px;height:16px}.top-toggle .switch input:checked+.slider:before{transform:translateX(14px)}.iconbtn{border:0;background:#eef2f7;color:#344054;border-radius:12px;min-width:44px;height:44px;font-size:21px;cursor:pointer}.iconbtn:hover{background:#e1e7f2}
.board{position:relative;display:grid;place-items:center;padding:26px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 0,#fff 40%,#f8faff 100%)}.letter-badge{position:absolute;top:20px;left:22px;background:#edf1ff;color:var(--primary);font-weight:900;padding:9px 14px;border-radius:12px}.progress{position:absolute;top:25px;right:24px;color:var(--muted);font-weight:700}.wordbox{text-align:center;max-width:100%}.word{font-family:TemelYazi,Arial,sans-serif;font-size:var(--word);font-weight:900;line-height:1.05;letter-spacing:.01em;overflow-wrap:anywhere}.word.enter{animation:pop .38s cubic-bezier(.2,.9,.25,1.2)}.word.heced span{display:inline-block;opacity:0;transform:translateY(18px) scale(.88);animation:syll .38s forwards;animation-delay:calc(var(--i)*.28s)}.word.heced.black span{color:var(--ink)!important}.word.heced.black span:not(:last-child)::after{content:'-';color:var(--ink)}.syllbtn.active{background:var(--primary);border-color:var(--primary);color:white;box-shadow:0 4px 12px #3157d544}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px;border-top:1px solid #e8ecf4;align-items:center}.nav{border:0;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}.prev{justify-self:end;background:#eef2f7;color:#344054}.next{justify-self:start;background:var(--primary);color:white}
.empty{text-align:center}.empty b{display:block;font-size:30px;margin-bottom:10px}.empty span{color:var(--muted)}
@keyframes pop{from{opacity:0;transform:scale(.76)}to{opacity:1;transform:scale(1)}}@keyframes syll{to{opacity:1;transform:none}}
@media(max-width:850px){.app{grid-template-columns:1fr;padding:0}.panel{position:fixed;z-index:5;inset:0 18% 0 0;border-radius:0;transform:translateX(-105%);transition:.25s}.panel.open{transform:none}.stage{border-radius:0}.app{height:100dvh}.topbar{flex-wrap:wrap}.top-options{order:3;width:100%}.word{font-size:clamp(64px,18vw,145px)}}
@media(pointer:coarse){button{min-height:42px}.chip span{min-height:38px}}
/* Dikey telefon yerleşimi: ayarlar üstte, sunum ortada, gezinme altta */
@media (max-width:600px) and (orientation:portrait){
  :root{--word:clamp(54px,18vw,112px);--radius:0}
  html,body{width:100%;height:100%;overscroll-behavior:none}
  body{height:100dvh;overflow:hidden;background:#fff}
  .app{height:100dvh;padding:0;gap:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .panel{position:static;inset:auto;z-index:auto;transform:none!important;width:100%;max-height:none;overflow:visible;border-radius:0;box-shadow:none;padding:6px 8px 7px;border-bottom:1px solid #dfe4ed;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;background:#fff}
  .brand{display:none}
  .section{min-width:0;margin:0;padding:0;border:0}
  .section:first-of-type{grid-column:1/-1}
  .section:last-child{grid-column:1/-1;display:flex;align-items:center;gap:8px;border-top:1px solid #edf0f5;padding-top:5px}
  .section:last-child .section-title{margin:0;white-space:nowrap;font-size:12px}
  .section-title{font-size:12px;margin:0 0 4px;line-height:1.1}
  .mini{padding:4px 7px;font-size:10px;min-height:28px!important}
  .chips{display:flex!important;justify-content:flex-start;gap:4px;overflow-x:auto;overflow-y:hidden;padding:1px 1px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
